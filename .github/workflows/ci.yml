name: CI

on:
  push:
  pull_request:

jobs:
  # Etage 1: rapide, sans dependance lourde. Attrape les fautes de frappe et les
  # JSON casses en ~20 s, meme si l'etage tests plus bas est en echec d'install.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Byte-compile every module (app + cz_* + tools)
        run: |
          python -m compileall -q app.py cz_*.py tools/*.py
      - name: Validate config + styles JSON
        run: |
          python -c "import json; json.load(open('config-sample.txt', encoding='utf-8')); print('config-sample.txt OK')"
          python -c "import json, glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('styles/*.json')]; print('styles/*.json OK')"
      - name: config-sample covers every CONFIG key read by the code
        run: python tools/check_config_keys.py

  # Etage 2: la vraie suite. Torch CPU (pas de GPU sur les runners), diffusers epingle
  # comme en local. Les tests qui exigent un GPU se sautent d'eux-memes.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run test suite
        run: python tools/run_tests.py -v
